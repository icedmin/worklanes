<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f8">
<title>Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --ink:#0d1117; --rule:#0d1117; --hair:#d4d9e1; --sub:#7a8494; --faint:#b3bac6;
  --acc:#2f5bff; --done:#9aa3b2; --danger:#d23b4a;
  --colw:320px;
  --f:"Inter Tight","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;border-radius:0}
input,textarea{font:inherit;color:inherit;border-radius:0}
.cap{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top-in{padding:12px 24px 10px;display:flex;align-items:center;gap:6px}
.brand{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sync{font-size:11px;color:var(--sub);letter-spacing:.04em;margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync.warn{color:#6b7a99}.sync.err{color:var(--danger)}
.sp{flex:1}
.tbtn{white-space:nowrap;height:30px;padding:0 10px;border:1px solid var(--ink);background:transparent;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.tbtn:disabled{opacity:.25;cursor:default}
.tbtn.primary{background:var(--ink);color:var(--bg)}
/* hero */
.board{padding:18px 24px 140px}
.hero{padding:6px 0 18px}
.hero h1{margin:0;font-size:clamp(44px,9vw,76px);line-height:.92;font-weight:700;letter-spacing:-.045em;text-transform:uppercase}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,220px));border-top:1px solid var(--rule);margin-top:18px}
.meta div{padding:8px 0 0;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.meta b{display:block;color:var(--ink);font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.meta .on b{color:var(--acc)}
/* columns */
#cats{display:flex;align-items:flex-start;overflow-x:auto;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cat{flex:0 0 var(--colw);width:var(--colw);padding:0 16px 10px;border-left:1px solid var(--rule);background:var(--bg);align-self:stretch;min-height:240px}
.cat:first-child{border-left:0;padding-left:0}
.addcol{flex:0 0 120px;align-self:stretch;border-left:1px solid var(--rule);display:flex;align-items:flex-start;padding:16px}
.addcol button{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);text-align:left;line-height:1.6}
.addcol button:hover{color:var(--ink)}
.ch{display:flex;align-items:flex-start;gap:4px;padding:12px 0 12px;min-height:76px;border-bottom:1px solid var(--rule)}
.ch .h{width:16px;padding-top:9px;display:flex;justify-content:center;color:var(--faint);cursor:grab;touch-action:none;font-size:12px;user-select:none;flex:none}
.ch .tg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex:1;min-width:0;text-align:left}
.ch .ttl{display:flex;align-items:flex-start;gap:6px;min-width:0;width:100%}
.ch .ix{font-size:10px;font-weight:500;color:var(--sub);padding-top:5px;font-variant-numeric:tabular-nums}
.ch .nm{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.08;word-break:keep-all;overflow-wrap:anywhere}
.cat.idle .ch .nm,.cat.idle .ch .ix{color:var(--faint)}
.ch .ct{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);white-space:nowrap;padding-left:22px}
.ch .ct b{color:var(--acc);font-weight:600}
.ch .mb{width:30px;height:30px;flex:none;font-size:16px;color:var(--sub)}
.ch .mb:hover{color:var(--ink)}
/* collapsed column */
.cat.col{flex-basis:64px;width:64px;padding:0 0 10px;cursor:pointer}
.cat.col .cb,.cat.col .ct,.cat.col .mb{display:none}
.cat.col .ch{flex-direction:column;align-items:center;border-bottom:0;padding:12px 0}
.cat.col .ch .h{padding-top:0;width:100%}
.cat.col .tg{align-items:center}
.cat.col .ttl{flex-direction:column;align-items:center}
.cat.col .nm{writing-mode:vertical-rl;font-size:20px;white-space:nowrap}
.cat.col .rundot{display:block}
.rundot{display:none;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:6px}
.cb{padding:0}
.list{min-height:8px}
/* rows */
.row{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--hair);position:relative;background:var(--bg)}
.row .h{width:16px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:grab;touch-action:none;user-select:none;font-size:11px;flex:none}
.st{width:34px;height:40px;flex:none;display:flex;align-items:center;justify-content:center}
.st i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:var(--bg);transition:background .12s,border-color .12s}
.s1 .st i{border-color:var(--acc)}
.s1 .st i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.s2 .st i{background:var(--ink);border-color:var(--ink)}
.row .tt{flex:1;min-width:0;text-align:left;padding:11px 6px 11px 2px;word-break:break-word;font-size:15px}
.row.s1 .tt{color:var(--acc);font-weight:500}
.row.s2 .tt{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.row .pg{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.04em;padding-right:2px;flex:none}
.row.s1 .pg{color:var(--acc)}
.row.open::before{content:"";position:absolute;left:-1px;top:0;bottom:-1px;width:2px;background:var(--ink)}
.add{display:flex;align-items:center;border-bottom:1px solid var(--hair);padding-left:16px}
.add::before{content:"+";width:34px;text-align:center;color:var(--sub);font-size:17px;font-weight:300}
.add input{flex:1;border:0;background:transparent;padding:11px 6px 11px 2px;outline:none;min-width:0;font-size:15px}
.add input::placeholder{color:var(--faint)}
.dn{padding-left:16px}
.dn>button{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding:10px 0 10px 8px}
.dn .rows{margin-left:-16px}
.ghost{opacity:.3}
.chosen{background:#fff}
.sortable-fallback{opacity:.95!important;box-shadow:0 8px 24px rgba(13,17,23,.14)}
/* menu */
.menu{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--ink);min-width:190px}
.menu .mi{display:block;width:100%;text-align:left;padding:11px 14px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--hair)}
.menu .mi:first-child{border-top:0}
.menu button.mi:hover{background:var(--ink);color:var(--bg)}
.menu .info{color:var(--sub);text-transform:none;letter-spacing:0;font-size:12px}
.menu .dz{color:var(--danger)}
.rn{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:0 0 2px;font-size:24px;font-weight:500;letter-spacing:-.03em;outline:none;min-width:0}
/* popups */
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#lines path{fill:none;stroke:var(--ink);stroke-width:1}
#lines rect{fill:var(--ink)}
.pop{position:fixed;z-index:40;width:340px;max-height:74vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--ink);box-shadow:8px 8px 0 rgba(13,17,23,.07)}
.pop.top1{z-index:41;box-shadow:10px 10px 0 rgba(13,17,23,.13)}
.ph{display:flex;align-items:center;gap:8px;padding:0 0 0 14px;height:40px;border-bottom:1px solid var(--ink);cursor:move;touch-action:none;user-select:none}
.ph .bk{display:none;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px 8px 0}
.ph .cn{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ph .x{width:40px;height:39px;border-left:1px solid var(--ink);font-size:16px}
.ph .x:hover{background:var(--ink);color:var(--bg)}
.pb{overflow:auto;padding:14px 14px 16px 0}
.pt{display:flex;align-items:flex-start}
.pt .st{width:36px;height:40px;margin-top:2px}
.pt textarea.ti{flex:1;border:0;outline:none;resize:none;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.12;padding:8px 0;background:transparent;overflow:hidden}
.pt.s1 textarea.ti{color:var(--acc)}
.pt.s2 textarea.ti{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:18px 0 0 14px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.pb .row,.pb .add,.pb .dn{margin-left:14px}
.pb .dn .rows{margin-left:-16px}
.note{display:block;width:calc(100% - 14px);margin-left:14px;min-height:84px;border:0;border-bottom:1px solid var(--hair);padding:10px 0;resize:vertical;outline:none;font-size:14px;background:transparent;line-height:1.5}
.note::placeholder{color:var(--faint)}
.pf{display:flex;justify-content:flex-end;padding:14px 0 0}
.del{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);padding:6px 0}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:0 0 0 16px;height:44px;display:flex;align-items:center;gap:16px;z-index:80;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.toast button{color:var(--bg);height:44px;padding:0 16px;border-left:1px solid #2a3240;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
/* auth / setup */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 24px 40px}
#gate .in{max-width:440px}
#gate h2{margin:28px 0 22px;font-size:clamp(40px,10vw,64px);line-height:.95;font-weight:700;letter-spacing:-.045em;text-transform:uppercase}
#gate label{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:16px;border-top:1px solid var(--rule);padding-top:8px}
#gate input{display:block;width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:10px 0;font-size:16px;outline:none}
#gate input:focus{border-bottom-color:var(--ink)}
#gate .acts{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
#gate .tbtn{height:40px;padding:0 16px}
#gate .msg{margin-top:16px;font-size:13px;color:var(--sub);min-height:20px;white-space:pre-line}
#gate .msg.err{color:var(--danger)}
#gate .lnk{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:28px;text-decoration:underline;text-underline-offset:3px}
.hidden{display:none!important}
@media (hover:none){ .row .h,.ch .h{width:26px} .add,.dn{padding-left:26px} .dn .rows{margin-left:-26px} }
@media (max-width:760px){
  .top-in,.board{padding-left:16px;padding-right:16px}
  .top-in{flex-wrap:wrap;row-gap:2px}
  .sync{order:9;width:100%;margin:0}
  .tbtn{padding:0 9px}
  :root{--colw:84vw}
  #cats{scroll-snap-type:x mandatory;margin-right:-16px;scroll-padding-left:0}
  .cat{scroll-snap-align:start}
  .addcol{flex-basis:110px;scroll-snap-align:end}
  .pop{left:0!important;top:0!important;width:100%!important;height:100%;max-height:none;border:0;box-shadow:none}
  .pop .ph{cursor:default;height:auto;padding:calc(10px + env(safe-area-inset-top)) 0 10px 16px}
  .pop .ph .bk{display:block}
  .pop .ph .x{display:none}
  .pop:not(.top1){display:none}
  #lines{display:none}
  .pb{padding:16px 16px calc(40px + env(safe-area-inset-bottom)) 0}
  .pt textarea.ti{font-size:30px}
}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <span class="brand">Task Board</span><span id="sync" class="sync"></span>
  <span class="sp"></span>
  <button class="tbtn" id="undo" title="되돌리기 (Ctrl+Z)">Undo</button>
  <button class="tbtn" id="redo" title="다시 실행 (Ctrl+Y)">Redo</button>
  <button class="tbtn" id="acct" aria-label="계정">···</button>
</div></div>
<div class="board" id="board"></div>
<svg id="lines"></svg>
<div id="pops"></div>
<div id="toast" class="toast hidden"><span id="tmsg"></span><button id="tundo">Undo</button></div>
<div id="gate" class="hidden"></div>

<script>
(function(){
"use strict";
var LSKEY="taskboard.v2.cache", LSSESS="taskboard.v2.session", LSCFG="taskboard.v2.config";
var POLL_MS=10000;
var state={v:1,cats:[],tasks:{}};
var hist=[],fut=[],pops=[],sortables=[],doneOpen={};
var cfg=null, sess=null;
var writing=false, dirty=false, lastRev=null, remoteRev=null, pendingRemote=null, online=false;
var $=function(s,el){return (el||document).querySelector(s)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function isMobile(){return window.matchMedia("(max-width:760px)").matches}
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- state ---------- */
function norm(s){
  if(!s||typeof s!=="object")s={};
  if(!Array.isArray(s.cats))s.cats=[];
  if(!s.tasks||typeof s.tasks!=="object")s.tasks={};
  s.cats.forEach(function(c){if(!Array.isArray(c.items))c.items=[];c.items=c.items.filter(function(id){return s.tasks[id]})});
  Object.keys(s.tasks).forEach(function(id){var t=s.tasks[id];if(!Array.isArray(t.kids))t.kids=[];t.kids=t.kids.filter(function(k){return s.tasks[k]});t.status=t.status|0;});
  delete s.rev;delete s.at;s.v=1;return s;
}
function T(id){return state.tasks[id]}
function catOf(c){return state.cats.filter(function(x){return x.id===c})[0]}
function rootCat(id){var t=T(id);while(t&&t.parent)t=T(t.parent);return t?catOf(t.cat):null}
function listOf(t){return t.parent?T(t.parent).kids:catOf(t.cat).items}
function progress(t){var n=t.kids.length;if(!n)return "";var d=t.kids.filter(function(k){return T(k).status===2}).length;return d+"/"+n}
function snapshot(){return JSON.stringify(state)}
function commit(fn,msg){var before=snapshot();fn();if(snapshot()===before)return;hist.push(before);if(hist.length>300)hist.shift();fut=[];changed();if(msg)toast(msg)}
function changed(){prunePops();render();save()}
function undo(){if(!hist.length)return;fut.push(snapshot());state=norm(JSON.parse(hist.pop()));changed();hideToast()}
function redo(){if(!fut.length)return;hist.push(snapshot());state=norm(JSON.parse(fut.pop()));changed()}

/* ---------- mutations ---------- */
function cycle(id){commit(function(){var t=T(id);t.status=(t.status+1)%3})}
function addTask(owner,isCat,title){
  title=title.trim();if(!title)return;
  commit(function(){var id=uid(),t={id:id,title:title,note:"",status:0,kids:[]};
    if(isCat){t.cat=owner;t.parent=null;catOf(owner).items.push(id)}else{t.parent=owner;T(owner).kids.push(id)}
    state.tasks[id]=t;});
}
function rmTree(x){T(x).kids.forEach(rmTree);delete state.tasks[x]}
function delTask(id){var t=T(id);if(!t)return;commit(function(){var l=listOf(t),i=l.indexOf(id);if(i>=0)l.splice(i,1);rmTree(id)},"Deleted")}
function addCat(){var id=uid();commit(function(){state.cats.push({id:id,name:"새 카테고리",collapsed:false,items:[]})});renameCat(id,true);
  var c=$("#cats");if(c)c.scrollLeft=c.scrollWidth}
function delCat(id){commit(function(){catOf(id).items.slice().forEach(rmTree);state.cats=state.cats.filter(function(x){return x.id!==id})},"Category deleted")}
function toggleCat(id){commit(function(){var c=catOf(id);c.collapsed=!c.collapsed})}

/* ---------- render ---------- */
function stIcon(t){return '<i>'+(t.status===2?"✓":"")+'</i>'}
function rowHTML(id,inDone){
  var t=T(id),pg=progress(t),open=pops.some(function(p){return p.id===id});
  return '<div class="row s'+t.status+(open?" open":"")+'" data-row="'+id+'">'+
    (inDone?'<span class="h" style="cursor:default"></span>':'<span class="h" title="끌어서 순서 변경">⋮⋮</span>')+
    '<button class="st" data-act="cycle" data-id="'+id+'" aria-label="상태 변경">'+stIcon(t)+'</button>'+
    '<button class="tt" data-act="open" data-id="'+id+'">'+esc(t.title)+'</button>'+(pg?'<span class="pg">'+pg+'</span>':"")+'</div>';

function api(path,opt){return fetch(cfg.url+path,opt).then(function(r){return r.text().then(function(tx){var j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok){var err=new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status));err.status=r.status;err.body=j;throw err}return j})})}

var refreshing=null;
function ensureToken(){
  if(!sess)return Promise.reject(new Error("no session"));
  if(Date.now()<sess.expires_at-60000)return Promise.resolve();
  if(refreshing)return refreshing;
  refreshing=api("/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:H(false),body:JSON.stringify({refresh_token:sess.refresh_token})})
    .then(function(j){keepSession(j,sess.email)}).catch(function(e){if(e.status===400||e.status===401){sess=null;lsSet(LSSESS,null);showLogin("로그인이 만료되었습니다. 다시 로그인하세요.")}throw e})
    .finally(function(){refreshing=null});
  return refreshing;
}
function pull(force){
  if(!sess)return Promise.resolve();
  return ensureToken().then(function(){return api("/rest/v1/boards?select=data,updated_at&user_id=eq."+encodeURIComponent(sess.uid),{headers:H(true)})})
    .then(function(rows){
      online=true;
      var d=rows&&rows[0]?rows[0].data:null;
      if(!d){ if(state.cats.length&&!writing){dirty=true;flush()} else setSync("동기화됨"); return }
      if(d.rev&&d.rev===remoteRev&&!force){if(!dirty&&!writing)setSync("동기화됨");return}
      remoteRev=d.rev||null;
      if(d.rev&&d.rev===lastRev){if(!dirty&&!writing)setSync("동기화됨");return}
      if(writing||dirty)return;
      if(isEditing()){pendingRemote=d;return}
      applyRemote(d);setSync("동기화됨");
    }).catch(function(e){if(sess){online=false;setSync("오프라인 — 이 기기에 보관 중, 연결되면 저장","warn")}});
}

var backoff=1000;

  if(!sess||writing||!dirty)return;

  var body=JSON.parse(snapshot());body.rev=rev;body.at=Date.now();
  ensureToken().then(function(){return api("/rest/v1/boards?on_conflict=user_id",{method:"POST",headers:Object.assign(H(true),{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({user_id:sess.uid,data:body,updated_at:new Date().toISOString()})})})
    .then(function(){writing=false;remoteRev=rev;backoff=1000;online=true;if(dirty)flush();else setSync("동기화됨")},
      function(e){writing=false;dirty=true;online=false;
        setSync(e.status?("저장 실패: "+e.message+" — 재시도 중"):"오프라인 — 이 기기에 보관 중, 연결되면 저장","warn");
        setTimeout(flush,backoff);backoff=Math.min(backoff*2,30000)});

  function fail(e){m.className="msg err";m.textContent=errText(e)}
  $("#g_in").onclick=function(){var em=$("#g_em").value.trim(),pw=$("#g_pw").value;if(!em||!pw)return fail(new Error("이메일과 비밀번호를 입력하세요."));
    busy("로그인 중…");api("/auth/v1/token?grant_type=password",{method:"POST",headers:H(false),body:JSON.stringify({email:em,password:pw})})
      .then(function(j){keepSession(j,em);afterLogin()},fail)};
  $("#g_up").onclick=function(){var em=$("#g_em").value.trim(),pw=$("#g_pw").value;if(!em||pw.length<6)return fail(new Error("이메일과 6자 이상 비밀번호를 입력하세요."));
    busy("계정 만드는 중…");api("/auth/v1/signup",{method:"POST",headers:H(false),body:JSON.stringify({email:em,password:pw})})
      .then(function(j){if(j&&j.access_token){keepSession(j,em);afterLogin()}else{m.className="msg";m.textContent="계정이 만들어졌습니다.\n이메일로 온 인증 링크를 누른 뒤 여기서 로그인하세요."}},fail)};
  $("#g_pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("#g_in").click()});
  if($("#g_cfg"))$("#g_cfg").onclick=function(){showSetup(false)};
}
function errText(e){var s=String(e&&e.message||e);
  if(/Invalid login credentials/i.test(s))return "이메일 또는 비밀번호가 맞지 않습니다.";
  if(/Email not confirmed/i.test(s))return "이메일 인증이 아직 안 됐습니다. 받은 메일의 링크를 누르세요.";
  if(/already registered/i.test(s))return "이미 있는 계정입니다. 로그인하세요.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(s))return "서버에 연결할 수 없습니다. 주소·인터넷을 확인하세요.";
  return s}
function afterLogin(){closeGate();setSync("불러오는 중…");pull(true)}
function logout(){var s=sess;sess=null;lsSet(LSSESS,null);
  if(s&&cfg)fetch(cfg.url+"/auth/v1/logout",{method:"POST",headers:{"apikey":cfg.key,"Authorization":"Bearer "+s.access_token}}).catch(function(){});
  state={v:1,cats:[],tasks:{}};lsSet(LSKEY,null);hist=[];fut=[];pops=[];render();showLogin()}

/* ---------- start ---------- */
function start(){
  var c=lsGet(LSKEY);if(c)state=norm(c);render();
  cfg=TB_CONFIG.url&&TB_CONFIG.key?{url:TB_CONFIG.url.replace(/\/+$/,""),key:TB_CONFIG.key}:lsGet(LSCFG);
  sess=lsGet(LSSESS);
  if(!cfg){showSetup(false);return}
  if(!sess){showLogin();return}
  setSync("불러오는 중…");pull(true);
}
window.__tb={get state(){return state},get hist(){return hist},get pops(){return pops},pull:pull,undo:undo,redo:redo};
start();
})();
</script>
</body>
